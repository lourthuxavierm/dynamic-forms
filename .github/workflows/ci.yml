name: Workspace CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/**"
      - "apps/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "apps/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.json"
      - "eslint.config.mjs"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: workspace-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frozen install and workspace verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Verify boundaries, lint, builds, types, and tests
        run: pnpm verify
