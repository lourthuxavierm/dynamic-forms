name: Documentation

on:
  pull_request:
    paths:
      - "apps/docs/**"
      - "packages/**"
      - "README.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".github/workflows/docs.yml"
      - ".github/CODEOWNERS"
      - ".github/pull_request_template.md"
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/**"
      - "README.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".github/workflows/docs.yml"
      - ".github/CODEOWNERS"
      - ".github/pull_request_template.md"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:governance
        env:
          DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: pnpm docs:verify
      - run: pnpm docs:build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm docs:test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docs-playwright-report
          path: apps/docs/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
