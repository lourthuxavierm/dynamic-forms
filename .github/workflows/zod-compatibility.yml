name: Zod compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/zod/**"
      - "packages/core/**"
      - "packages/examples/**"
      - "packages/react/**"
      - "packages/react-html/**"
      - "packages/angular/**"
      - "packages/angular-html/**"
      - "apps/react-html-playground/**"
      - "apps/angular-html-playground/**"
      - "apps/docs/playwright.config.ts"
      - "apps/docs/zod-playground.config.ts"
      - "apps/docs/tests/example-catalogue.spec.ts"
      - "apps/docs/tests/angular-implementation.spec.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/zod-compatibility.yml"
  push:
    branches: [main]
    paths:
      - "packages/zod/**"
      - "packages/core/**"
      - "packages/examples/**"
      - "packages/react/**"
      - "packages/react-html/**"
      - "packages/angular/**"
      - "packages/angular-html/**"
      - "apps/react-html-playground/**"
      - "apps/angular-html-playground/**"
      - "apps/docs/playwright.config.ts"
      - "apps/docs/zod-playground.config.ts"
      - "apps/docs/tests/example-catalogue.spec.ts"
      - "apps/docs/tests/angular-implementation.spec.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/zod-compatibility.yml"

permissions:
  contents: read

concurrency:
  group: zod-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter:
    name: Zod ${{ matrix.zod }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        zod: ["3.25.5", "3.25.76", "4.0.0", "4.5.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select Zod ${{ matrix.zod }}
        run: pnpm --filter @dynamic-forms/zod add --save-dev --lockfile=false zod@${{ matrix.zod }}
      - run: pnpm --filter @dynamic-forms/zod typecheck
      - run: pnpm --filter @dynamic-forms/zod test
      - run: pnpm --filter @dynamic-forms/zod build

  playground-evidence:
    name: React and Angular playground evidence
    needs: adapter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dynamic-forms/react-html-playground... build
      - run: pnpm --filter @dynamic-forms/angular-html-playground... build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @dynamic-forms/docs exec playwright test --config zod-playground.config.ts --grep Zod

  release-gate:
    name: Release gate
    needs: [adapter, playground-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:zod-release
